name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build TUI, TUI app, and GUI app
        run: make release

      - name: Create release assets
        run: |
          mkdir -p release-assets
          cp build/nosleep-tui release-assets/
          cp -r build/NoSleep-TUI.app release-assets/
          cp -r build/NoSleep-GUI.app release-assets/
          cp cli/nosleep.sh release-assets/
          cd release-assets
          zip -r nosleep-tui-macos.zip nosleep-tui
          zip -r nosleep-tui-app-macos.zip NoSleep-TUI.app
          zip -r nosleep-gui-macos.zip NoSleep-GUI.app
          zip -r nosleep-cli-only.zip nosleep.sh

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            release-assets/nosleep-cli-only.zip \
            release-assets/nosleep-tui-macos.zip \
            release-assets/nosleep-tui-app-macos.zip \
            release-assets/nosleep-gui-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
