name: NoSleepGUI
options:
  bundleIdPrefix: com.piyawasin
targets:
  NoSleepGUI:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: ../cli/nosleep.sh
        type: file
        buildPhase: resources
      - path: AppIcon.icns
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piyawasin.nosleep.gui
        PRODUCT_NAME: NoSleep
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
    info:
      path: Info.plist
      properties:
        CFBundleIconFile: AppIcon
    entitlements:
      path: NoSleep-GUI.entitlements
      properties:
        com.apple.security.app-sandbox: false
